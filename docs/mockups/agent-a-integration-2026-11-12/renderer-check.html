function reset(blank=false){epoch++;timers.forEach(clearTimeout);timers.clear();docs=initial();threads=[];selected='A';page='files';panel='document';drafts={};notices=[];summaries=[];seq=1;modal=null;empty=blank;failNext=false;unknownNext=false;scenarioOpen=false;render();}
const current=()=>docs[selected], version=(d,n)=>d.versions.find(v=>v.n===n), key=()=>selected+':'+current().view;
const statuses={queued:'대기 중',ready:'변경안 준비',answered:'답변 도착',applied:'새 본문 확인됨',unknown:'저장 응답 미확인',rejected:'거절됨',late:'담당 교체 · 인계 검토',conflict:'기준 버전 충돌',stopped:'중단 요청됨',stoppedDone:'중단 확인',failed:'연결 실패',superseded:'새 변경안으로 대체'};
function notice(text,t){notices.push({text,id:t?.id,doc:t?.doc});}
function origin(t){return '<details class="source"><summary>요청 출처 · 고정된 연결 정보</summary><dl><dt>자료 / 검토본</dt><dd>'+esc(docs[t.doc].artifact)+' / demo-review-'+t.doc+'-'+t.version+'</dd><dt>대상 버전</dt><dd>v'+t.version+' · '+esc(t.sourceFile)+'</dd><dt>업무</dt><dd>'+esc(t.task)+' / '+esc(t.taskId)+'</dd><dt>댓글 / 실행</dt><dd>'+esc(t.id)+' / '+esc(t.run)+'</dd><dt>전송 때 담당</dt><dd>'+esc(t.sourceOwner||t.owner)+' · 배정 '+(t.sourceAssignment||t.assignment)+'</dd><dt>현재 담당</dt><dd>'+esc(docs[t.doc].owner)+' · 배정 '+docs[t.doc].assignment+'</dd></dl><p>모두 시연 ID입니다. 직원 연결·실행 ID는 통합 제안이며 Agent-A의 현재 필드라는 뜻이 아닙니다.</p></details>';}
function btn(a,text,t,cls=''){return '<button type="button" class="button small '+cls+'" data-action="'+a+'"'+(t?' data-thread="'+t.id+'"':'')+'>'+text+'</button>';}
function thread(t){let actions='';
 if(t.status==='queued')actions=btn('stop','중단 요청',t);
 if(['ready','conflict'].includes(t.status))actions=btn('preview','변경 전후 보기',t,'primary');
 if(t.status==='late')actions=btn('adopt','새 담당이 인계 검토',t);
 if(t.status==='failed')actions=btn('retry','같은 요청 다시 확인',t);
 if(t.status==='unknown')actions=btn('reconcile','저장 결과 조회',t,'primary');
 if(t.status==='applied')actions=btn('latest','새 본문 보기',t);
 if(t.status==='stopped')actions=btn('confirm-stop','중단 확인 수신',t);
 const answers=t.answer?'<div class="answer"><div class="answer-author">'+esc(t.answerOwner||t.owner)+' · 예시 답변</div><p>'+esc(t.answer)+'</p></div>':'';
 return '<article class="thread" id="thread-'+t.id+'"><div class="thread-meta"><span>자료 '+t.doc+' · v'+t.version+'</span><span class="tag '+(['late','failed','conflict','unknown'].includes(t.status)?'amber':'')+'">'+statuses[t.status]+'</span></div><p class="comment-text">'+esc(t.text)+'</p>'+answers+(t.status==='late'?'<p class="version-note">이전 담당의 결과입니다. 자동 반영하거나 새 담당의 답변으로 표시하지 않습니다.</p>':'')+(t.status==='unknown'?'<p class="version-note">예시 서버에는 저장됐지만 응답을 받지 못했습니다. 다시 적용하지 않고 원래 요청의 결과를 조회합니다.</p>':'')+(t.status==='applied'?'<p class="version-note">v'+t.applied+'에 저장하고 새 본문 표시를 확인했습니다. 이 댓글의 원문은 v'+t.version+'입니다.</p>':'')+origin(t)+(t.proposals.length?'<details class="source"><summary>변경안 이력 · '+t.proposals.length+'개 보존</summary>'+t.proposals.map(p=>'<p>'+esc(p.id)+' · v'+p.base+' 기준 · 대체됨</p>').join('')+'</details>':'')+'<div class="thread-actions">'+actions+btn('reply-toggle','답글 · 후속 지시',t)+'</div><div class="replies">'+t.replies.map(r=>'<p><b>'+esc(r.who)+'</b> '+esc(r.text)+'</p>').join('')+'</div>'+(t.showReply?'<div class="reply-compose"><input aria-label="답글" data-reply="'+t.id+'" value="'+esc(t.replyDraft||'')+'" placeholder="같은 원문에 이어서 질문"><button type="button" class="button small" data-action="reply" data-thread="'+t.id+'">보내기</button></div>':'')+'</article>';
}
function reader(){let d=current(),v=version(d,d.view),list=threads.filter(t=>t.doc===d.id&&t.version===d.view),other=threads.filter(t=>t.doc===d.id&&t.version!==d.view);
 return '<article class="reader glass" data-panel="'+panel+'"><header class="doc-head"><div class="doc-head-top"><div><p class="eyebrow">문서 · 연결 검토 <span class="tag purple">통합 제안</span></p><h2>자료 '+d.id+' · '+d.title+'</h2></div><label class="version-control">검토 원문<select id="version" aria-label="자료 버전">'+d.versions.slice().reverse().map(v=>'<option value="'+v.n+'" '+(d.view===v.n?'selected':'')+'>v'+v.n+(d.latest===v.n?' · 최신':' · 이전 원문')+'</option>').join('')+'</select></label></div><div class="head-meta"><span class="tag purple">'+d.task+'</span><span>담당 '+d.owner+'</span><span>Agent-A 정본 v'+d.latest+'</span></div></header><div class="mobile-tabs"><button data-action="panel-doc" class="'+(panel==='document'?'active':'')+'">본문</button><button data-action="panel-review" class="'+(panel==='review'?'active':'')+'">검토 · '+list.length+'</button></div><div class="reading-columns"><div class="paper-wrap">'+(d.view!==d.latest?'<div class="version-note">이전 검토 원문 v'+d.view+'입니다. '+btn('latest','최신 v'+d.latest+' 보기')+'</div>':'')+'<div class="paper"><p class="overline">'+(d.id==='A'?'SERVICE INTRODUCTION':'MENTORING NOTES')+' / DEMO</p><h3>'+(d.id==='A'?'복잡한 업무를,<br>하나의 흐름으로':'들은 조언에서,<br>다음 실험으로')+'</h3><p class="lead">'+esc(v.lead)+'</p><div class="rule"></div><h4>확인할 기준</h4><p class="body-copy">'+(d.id==='A'?'소개서는 실제 제공 범위에 맞게 씁니다. 과장된 약속을 줄이고, 사용자가 무엇을 확인하고 결정할 수 있는지 설명합니다.':'멘토의 의견과 대표의 결정을 구분합니다. 이번 서비스에서 검증할 가정과 다른 업무에 적용할 기준을 따로 남깁니다.')+'</p><h4>기록과 다음 행동</h4><p class="body-copy">자료 옆에서 자세히 검토하고, 채택한 결과와 이유만 업무 대화로 연결합니다. 이전 원문과 댓글은 그 버전에 보존합니다.</p><p class="inline-notes">'+(d.view===1?'최초 원문 · 이 버전의 댓글은 이후에도 보존됩니다.':'변경안 수락으로 생성된 시연 버전입니다.')+'</p></div><div class="doc-footer">Agent-A 정본의 읽기용 투영 · IAMCEO 파일은 해당 버전 참조/내보내기라는 제안</div></div><aside class="review-panel" aria-label="자료 검토"><div class="review-head"><h3>검토</h3><span class="tag">'+d.owner+'</span></div><p class="review-intro">자료 A/B를 같은 담당이 맡습니다.<br>댓글의 원문과 업무는 보낸 때 고정합니다.</p>'+(other.length?'<div class="version-note">다른 버전의 댓글 '+other.length+'개 '+btn('original','원래 댓글 보기')+'</div>':'')+(list.length?list.map(thread).join(''):'<p class="empty">아직 이 버전에 댓글이 없습니다.</p>')+'<div class="composer"><label for="request">v'+d.view+'에 검토 요청</label><select class="choose" id="request-kind" aria-label="요청 종류"><option value="edit">문서 수정 요청</option><option value="question">질문 · 답변만</option></select><textarea id="request" maxlength="700" placeholder="예: 과장된 표현을 실제 제공 범위에 맞춰 줄여 주세요.">'+esc(drafts[key()]||'')+'</textarea><div class="composer-bottom"><small>자료 '+d.id+' · v'+d.view+' · '+d.owner+'</small><button type="button" class="button primary small" data-action="send" '+(!(drafts[key()]||'').trim()?'disabled':'')+'>요청 보내기</button></div><p class="mode">IAMCEO 담당 전달 방식은 통합 제안입니다. 현재 Agent-A의 자체 자동 답변과 동시 실행하지 않습니다.</p></div></aside></div></article>';
}
function chat(){return '<section class="glass chat-page"><div class="chat-intro"><p class="eyebrow">업무 대화 · 같은 결과의 연결</p><h2>결정과 결과만 모아 봅니다</h2><p>댓글 전문은 복사하지 않습니다. 원래 검토 기록으로 돌아갈 수 있습니다.</p></div>'+(summaries.length?summaries.slice().reverse().map(s=>'<article class="summary-card"><span class="tag">'+s.task+'</span><h3>자료 '+s.doc+' · '+s.title+'</h3><p>'+s.text+'</p>'+btn('summary','원래 자료·댓글로',threads.find(t=>t.id===s.thread))+'</article>').join(''):'<p class="empty">아직 확정한 변경이 없습니다. 답변 도착만으로 반영 완료 요약을 만들지 않습니다.</p>')+btn('files','자료로 돌아가기')+'</section>';}
function render(){let d=current();$('app').innerHTML='<div class="shell"><aside class="side glass"><div class="brand"><i></i>IAMCEO</div><div class="side-note"><b>본사</b><br>통합 설계 체험</div><div><small>프로젝트</small><div class="project">네이티브 · Codex 체험<span>자료 검토 · 목업</span></div></div><p class="side-note">프로젝트와 직원 구조를 유지하며<br>자료 검토를 연결합니다.</p><div class="sidefoot"><i></i>목업 · 시연 데이터</div></aside><main class="main"><header class="top"><div><div class="project-title">네이티브 · Codex 체험</div><p class="top-caption">IAMCEO × Agent-A · 2026.11.12 통합 제안</p></div><nav class="nav"><button disabled>홈</button><button disabled>결재함</button><button disabled>팀</button><button data-action="chat" class="'+(page==='chat'?'active':'')+'">대화</button><button data-action="files" class="'+(page==='files'?'active':'')+'">자료</button></nav></header><div class="toolbar"><div><p class="eyebrow">CLICKABLE INTEGRATION MOCK</p><h1>'+(page==='chat'?'대화 요약':'자료')+'</h1><p>문서 정본과 검토는 Agent-A에, 업무와 담당은 IAMCEO에.</p></div><div>'+btn('chat','대화 요약 보기')+' '+btn('reset','초기화')+'</div></div><div id="alerts">'+notices.slice(-3).map((n,i)=>'<div class="notice" role="status"><span>'+esc(n.text)+'</span>'+(n.id?'<button data-action="notification" data-thread="'+n.id+'">원래 요청 열기 ↗</button>':'')+'</div>').join('')+'</div>'+(empty?'<section class="glass chat-page"><h2>아직 연결한 자료가 없습니다</h2><p>기존 파일을 자동 이전하지 않습니다. 명시적으로 연결할 문서부터 고릅니다.</p>'+btn('reset','시연 자료 A/B 불러오기')+'</section>':page==='chat'?chat():'<div class="pill-switch">'+Object.values(docs).map(x=>'<button data-action="select" data-doc="'+x.id+'" class="'+(selected===x.id?'selected':'')+'">자료 '+x.id+' · '+x.title+'</button>').join('')+'</div><div class="workspace"><aside class="library glass"><div class="library-head"><span>연결한 자료</span><b>2</b></div>'+Object.values(docs).map(x=>'<button class="doc-row '+(selected===x.id?'selected':'')+'" data-action="select" data-doc="'+x.id+'"><span class="file-icon">'+x.id+'</span><span><b>'+x.title+'</b><small>'+x.task+' · v'+x.latest+'</small></span></button>').join('')+'<p class="library-tip">A에서 요청 후 B로 이동해 보세요.<br><br>결과 알림은 원래 A·v1·업무로 돌아갑니다.</p></aside>'+reader()+'</div>')+'<details class="scenario"'+(scenarioOpen?' open':'')+'><summary>충돌·오류·중단도 체험하기 · 통합 제안</summary><div class="controls">'+btn('reassign','현재 자료 담당 교체')+btn('advance','다른 수정으로 최신본 변경')+btn('fail-next',failNext?'다음 응답 실패 대기 중':'다음 응답 연결 실패')+btn('unknown-next',unknownNext?'다음 저장 응답 누락 대기 중':'다음 저장 응답 누락')+btn('empty','빈 상태 보기')+'</div><p>담당 교체는 대기 중, 최신본 변경은 변경안 도착 후 눌러 보세요. 중단은 검토 스레드에서 요청하며 확인 전까지 중단 완료로 표시하지 않습니다. 모든 상태는 화면 안의 예시입니다.</p></details><p class="footnote">이것은 설계 체험용 목업입니다. 문서 API의 정확한 외부 실행자 계약은 추가 확인/개발 대상입니다. 입력은 새로 열거나 초기화하면 사라집니다.</p></main></div>';renderModal();}
function schedule(t){let e=epoch;const timer=setTimeout(()=>{timers.delete(timer);if(e!==epoch||t.status!=='queued')return;
 if(t.shouldFail){t.shouldFail=false;t.status='failed';t.answer='연결 오류 예시입니다. 전송 출처와 입력은 보존했습니다.';}
 else{t.answerOwner=t.owner;t.answer=t.kind==='question'?'이 표현은 제공 범위를 넘는 약속입니다. 실제 기능과 사용자 확인 범위에 맞춰 검토하는 편이 좋겠습니다.':'원래 요청과 원문을 기준으로 변경안을 준비했습니다. 아직 정본에는 적용하지 않았습니다.';t.status=t.assignment!==docs[t.doc].assignment?'late':t.kind==='question'?'answered':'ready';}
 notice('자료 '+t.doc+' · v'+t.version+' 요청 결과: '+statuses[t.status],t);render();},1800);timers.add(timer);}
function send(){let d=current(),text=(drafts[key()]||'').trim();if(!text)return;let id='demo-comment-'+seq++;let t={id,doc:d.id,version:d.view,base:d.view,text,kind:$('request-kind').value,sourceFile:version(d,d.view).file,task:d.task,taskId:d.taskId,owner:d.owner,assignment:d.assignment,sourceOwner:d.owner,sourceAssignment:d.assignment,run:'demo-run-'+id,status:'queued',answer:'',replies:[],shouldFail:failNext,proposals:[],proposalId:id+'-proposal-1'};failNext=false;threads.push(t);drafts[key()]='';panel='review';render();schedule(t);}
function open(t){selected=t.doc;docs[selected].view=t.version;page='files';panel='review';render();setTimeout(()=>$('thread-'+t.id)?.scrollIntoView({block:'nearest'}),20);}
function summary(t){if(summaries.some(s=>s.thread===t.id&&s.version===t.applied))return;summaries.push({thread:t.id,doc:t.doc,task:t.task,title:'v'+t.applied+'의 변경',version:t.applied,text:'표현을 실제 제공 범위에 맞게 고치는 안을 채택했습니다. 이유: 과장 방지. 새 정본과 표시 본문을 확인했습니다. 상세 근거는 원래 검토에 남습니다.'});}
function after(t){let v=version(docs[t.doc],t.base);return changed(t.doc)+(v.lead.includes('다른 요청에서')?' 다른 요청에서 검증 범위를 추가했습니다.':'');}
function renderModal(){if(!modal){$('overlay').innerHTML='';return;}const t=threads.find(x=>x.id===modal),d=docs[t.doc],stale=t.base!==d.latest,late=t.assignment!==d.assignment;
 $('overlay').innerHTML='<div class="dialog-shade" style="top:'+modalAt+'px"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="diff-title"><header class="dialog-header"><div><p class="eyebrow">정확한 변경안 검토 · 시연</p><h2 id="diff-title">자료 '+t.doc+' · v'+t.base+' 기준 변경</h2><p>'+esc(t.proposalId)+'<br>댓글 원문은 v'+t.version+'에 보존 · '+esc(t.owner)+'</p></div><button data-action="close-modal" class="close" aria-label="변경안 닫기">×</button></header><div class="diff"><div><small>변경 전 · v'+t.base+'</small><p>'+esc(version(d,t.base).lead)+'</p></div><div class="after"><small>변경 후 후보</small><p>'+esc(after(t))+'</p></div></div><p class="checks">문서·검토·질문 관계, 기준 문맥·블록 버전과 read-set을 서버가 확인하는 계약을 시연합니다. 실제 검사는 실행하지 않습니다.</p>'+(stale?'<div class="version-note">최신 정본은 v'+d.latest+'입니다. 옛 변경안을 바로 적용하지 않습니다. 최신본을 다시 읽고 별도 변경안을 검토해야 합니다.</div>':'')+(late?'<div class="version-note">현재 담당과 다른 이전 배정의 결과입니다. 먼저 새 담당의 인계 검토가 필요합니다.</div>':'')+'<footer class="dialog-footer"><small>수락은 문서 변경에만 해당합니다.<br>개발 실행·배포 승인이 아닙니다.</small>'+btn('reject','거절',t)+(late?btn('adopt','새 담당 인계 검토',t):stale?btn('rebase','최신본으로 새 변경안 검토',t,'primary'):btn('apply','이 변경안 반영',t,'primary'))+'</footer></section></div>';
 setTimeout(()=>$('overlay').querySelector('.dialog')?.scrollIntoView({block:'center'}),20);
}
function commit(t){let d=docs[t.doc];if(t.base!==d.latest||t.assignment!==d.assignment){t.status=t.assignment!==d.assignment?'late':'conflict';renderModal();return;}if(t.applied)return;let n=d.latest+1;d.versions.push({n,lead:after(t),file:'demo-file-'+d.id+'-'+n});d.latest=n;t.applied=n;modal=null;selected=d.id;
 if(unknownNext){unknownNext=false;t.status='unknown';notice('자료 '+d.id+' 저장 응답 미확인',t);}
 else{t.status='applied';d.view=n;panel='document';summary(t);notice('자료 '+d.id+' · v'+n+' 새 본문 확인됨. 원래 댓글은 v'+t.version+'에 남습니다.',t);}render();}
document.addEventListener('toggle',e=>{if(e.target.isConnected&&e.target.classList.contains('scenario'))scenarioOpen=e.target.open;},true);
document.addEventListener('input',e=>{if(e.target.id==='request'){drafts[key()]=e.target.value;document.querySelector('[data-action=send]').disabled=!e.target.value.trim();}if(e.target.dataset.reply){let t=threads.find(t=>t.id===e.target.dataset.reply);t.replyDraft=e.target.value;}});
document.addEventListener('change',e=>{if(e.target.id==='version'){current().view=+e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){modal=null;renderModal();}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,t=threads.find(t=>t.id===b.dataset.thread),d=current();
 if(a==='send')send();else if(a==='reset')reset();else if(a==='select'){selected=b.dataset.doc;page='files';render();}
 else if(a==='chat'){page='chat';render();}else if(a==='files'){page='files';render();}
 else if(a==='panel-doc'){panel='document';render();}else if(a==='panel-review'){panel='review';render();}
 else if(a==='notification'||a==='summary')open(t);
 else if(a==='latest'){if(t)selected=t.doc;current().view=current().latest;panel='document';render();}
 else if(a==='original'){let x=threads.find(x=>x.doc===d.id&&x.version!==d.view);if(x)open(x);}
 else if(a==='preview'){modal=t.id;modalAt=Math.max(30,b.getBoundingClientRect().top+scrollY-130);renderModal();}
 else if(a==='close-modal'){modal=null;renderModal();}
 else if(a==='apply')commit(t);
 else if(a==='reject'){t.status='rejected';modal=null;notice('자료 '+t.doc+' 변경안을 거절했습니다. 원문은 유지됩니다.',t);render();}
 else if(a==='rebase'){t.proposals.push({id:t.proposalId,base:t.base,status:'superseded'});t.proposalId=t.id+'-proposal-'+(t.proposals.length+1);t.base=docs[t.doc].latest;t.status='ready';render();}
 else if(a==='reassign'){d.assignment++;d.owner='검토 담당';threads.filter(x=>x.doc===d.id&&['ready','answered','conflict'].includes(x.status)).forEach(x=>x.status='late');notice('자료 '+d.id+' 담당이 교체됐습니다. 기존 요청의 배정 출처는 유지됩니다.');render();}
 else if(a==='adopt'){t.replies.push({who:docs[t.doc].owner,text:'이전 담당의 결과와 원문을 인계 검토했습니다. 이번 배정에서 재검토할 새 변경안을 만들었습니다.'});t.proposals.push({id:t.proposalId,base:t.base,assignment:t.assignment,status:'superseded'});t.proposalId=t.id+'-proposal-'+(t.proposals.length+1);t.previousAssignment=t.assignment;t.assignment=docs[t.doc].assignment;t.owner=docs[t.doc].owner;t.status=t.kind==='question'?'answered':'ready';modal=null;render();}
 else if(a==='advance'){let n=d.latest+1;d.versions.push({n,lead:version(d,d.latest).lead+' 다른 요청에서 검증 범위를 추가했습니다.',file:'demo-file-'+d.id+'-'+n});d.latest=n;threads.filter(x=>x.doc===d.id&&x.status==='ready').forEach(x=>x.status='conflict');notice('자료 '+d.id+'에 다른 변경으로 v'+n+'이 생겼습니다. 기존 검토 원문은 그대로입니다.');render();}
 else if(a==='fail-next'){failNext=!failNext;render();}else if(a==='unknown-next'){unknownNext=!unknownNext;render();}
 else if(a==='retry'){t.status='queued';t.run+='-retry';render();schedule(t);}
 else if(a==='reconcile'){t.status='applied';docs[t.doc].view=t.applied;selected=t.doc;panel='document';summary(t);notice('원래 요청의 저장 결과 v'+t.applied+'를 조회하고 새 본문을 확인했습니다. 중복 버전은 만들지 않았습니다.',t);render();}
 else if(a==='stop'){t.status='stopped';render();}else if(a==='confirm-stop'){t.status='stoppedDone';t.answer='시연 실행기의 중단 확인을 받았습니다. 일부 결과와 원문은 보존합니다.';render();}
 else if(a==='reply-toggle'){t.showReply=!t.showReply;render();}
 else if(a==='reply'){let text=(t.replyDraft||'').trim();if(!text)return;t.replies.push({who:'대표',text},{who:'시연 답변',text:'후속 지시를 같은 원문에 연결했습니다. 새 수정안이 필요하면 최신 정본을 다시 확인하며, 이 답글 자체로 적용하지 않습니다.'});t.replyDraft='';render();}
 else if(a==='empty')reset(true);
});
reset();
})();

</script></body></html></body></html>
