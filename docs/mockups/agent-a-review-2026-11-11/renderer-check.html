<script>
(()=>{'use strict';
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4M9 12h6M9 16h6"/></svg>';

const makeDocs=()=>({A:{id:'A',title:'서비스 소개서',subtitle:'가치와 약속을 명확하게',task:'소개서 개선',kind:'HTML',latest:1,view:1,unread:false,versions:[{n:1,file:'시연 A-v1',title:'복잡한 업무를,\n하나의 흐름으로',lead:'아이디어에서 실행까지, 필요한 일을 한곳에서 이어갑니다. 당신의 모든 일을 자동으로 완성하는 새로운 작업 공간입니다.',body:'목표를 정리하고, 필요한 자료를 모으고, 결과를 검토합니다. 여러 업무를 오가더라도 다음에 할 일이 무엇인지 분명하게 볼 수 있습니다.',note:'처음 공개한 소개서 초안입니다.'}]},B:{id:'B',title:'멘토링 기록',subtitle:'배운 것을 다음 행동으로',task:'멘토링 정리',kind:'문서',latest:1,view:1,unread:false,versions:[{n:1,file:'시연 B-v1',title:'질문은 줄이고,\n다음 행동은 분명하게',lead:'좋은 조언을 듣는 것에서 멈추지 않고, 이번 주에 해볼 수 있는 작은 행동으로 옮깁니다.',body:'멘토의 의견, 아직 확인하지 못한 가정, 직접 선택한 결정을 나누어 기록합니다. 모든 조언을 바로 실행하기보다 지금의 목표와 연결되는 항목부터 살펴봅니다.',note:'멘토링 내용을 정리한 시연용 문서입니다.'}]}});
let docs=makeDocs(),threads=[],summaries=[],seq=1,selected='A',page='files',panel='document',hint=true,focusThread=null,modal=null,drafts={},toast=null,epoch=0;
const timers=new Set();const el=id=>document.getElementById(id);const notificationNode=el('notification');let modalAt=40;const current=()=>docs[selected];const version=(d,n)=>d.versions.find(v=>v.n===n);const visibleThreads=d=>threads.filter(t=>t.doc===d.id&&t.version===d.view);const key=()=>selected+':'+current().view;
function seed(){threads=[{id:'seed-a',doc:'A',version:1,text:'소개서의 약속이 실제로 제공할 수 있는 범위인지 함께 봐 주세요.',status:'note',answer:'문서 전체의 표현을 확인했습니다. 아래에서 수정 요청을 보내면, 변경안을 확인하고 새 버전으로 반영하는 과정을 체험할 수 있어요.',replies:[]},{id:'seed-b',doc:'B',version:1,text:'이번 주에 할 일을 세 가지 이내로 정리하면 좋겠어요.',status:'note',answer:'목표와 연결되는 항목부터 정리하는 방향으로 읽어보겠습니다.',replies:[]}];}

function status(t){return({note:'답변됨',queued:'접수됨',ready:'변경안 준비됨',applied:'반영 완료',conflict:'최신 버전 확인 필요'})[t.status]||'확인 중';}

function threadHTML(t){return '<article class="thread '+(focusThread===t.id?'focused':'')+'" id="thread-'+t.id+'"><div class="thread-meta"><span>자료 '+t.doc+' · v'+t.version+' 전체</span><span class="tag '+(t.status==='applied'?'green':t.status==='ready'?'purple':'')+'">'+status(t)+'</span></div><div class="comment-author"><span class="avatar">나</span>대표 <span class="tag">'+(t.status==='note'?'댓글':'수정 요청')+'</span></div><p class="comment-text">'+esc(t.text)+'</p><p class="target">대상: '+esc(docs[t.doc].task)+' · '+esc(version(docs[t.doc],t.version).file)+'</p>'+(t.status==='queued'?'<div class="pending"><i></i>문서 담당이 시연 답변을 준비하고 있어요.</div>':'<div class="answer"><div class="comment-author"><span class="avatar">문</span>문서 담당 <span class="tag">시연</span></div><p class="comment-text">'+esc(t.answer)+'</p><small>'+(t.status==='applied'?'요청한 변경을 v'+t.appliedVersion+'에 반영한 시연입니다.':'실제 AI 응답이 아닌 예시 답변입니다.')+'</small></div>')+(t.replies||[]).map(r=>'<p class="subreply"><b>'+esc(r.author)+'</b><br>'+esc(r.text)+'</p>').join('')+'<div class="thread-actions">'+(['ready','conflict'].includes(t.status)?'<button class="button small '+(t.status==='ready'?'primary':'')+'" data-action="preview" data-thread="'+t.id+'">'+(t.status==='conflict'?'변경안 다시 확인':'변경안 확인')+'</button>':'')+(t.status==='applied'?'<button class="button small" data-action="view-applied" data-thread="'+t.id+'">v'+t.appliedVersion+' 보기 ↗</button>':'')+'<button class="button small plain" data-action="reply-toggle" data-thread="'+t.id+'">답글</button></div><div class="reply-form" data-reply="'+t.id+'" hidden><input aria-label="댓글에 답글" placeholder="답글 남기기" maxlength="400"><button class="button small" type="button" data-action="reply-send" data-thread="'+t.id+'">남기기</button></div></article>';}
function readerHTML(){let d=current(),v=version(d,d.view),list=visibleThreads(d),other=threads.filter(t=>t.doc===d.id&&t.version!==d.view),old=d.view!==d.latest;return '<article class="reader glass" data-panel="'+panel+'"><div class="doc-head"><div class="head-upper"><div><p class="kind">'+d.kind+' · 문서 담당 <span class="tag">시연</span></p><h2>자료 '+d.id+' · '+esc(d.title)+'</h2></div><label class="version-control">버전<select id="version" aria-label="자료 버전">'+d.versions.slice().reverse().map(x=>'<option value="'+x.n+'" '+(d.view===x.n?'selected':'')+'>v'+x.n+(x.n===d.latest?' · 최신':' · 이전 버전')+'</option>').join('')+'</select></label></div><div class="head-meta"><span class="tag purple">'+esc(d.task)+'</span><span>'+esc(v.file)+'</span><span>•</span><span>담당: 문서 담당</span>'+(old?'<span class="tag amber">이전 버전</span>':'<span class="tag green">최신 버전</span>')+'</div></div><div class="mobile-tabs"><button data-action="panel-doc" class="'+(panel==='document'?'active':'')+'">본문</button><button data-action="panel-review" class="'+(panel==='review'?'active':'')+'">검토 · '+list.length+'</button></div><div class="reading-columns"><div class="paper-wrap">'+(old?'<div class="version-note">v'+d.view+'의 원문을 보고 있어요. <button data-action="latest" style="color:var(--violet);text-decoration:underline">최신 v'+d.latest+' 보기</button></div>':'')+'<div class="paper"><p class="overline">'+(d.id==='A'?'SERVICE INTRODUCTION':'MENTORING NOTES')+' / DEMO</p><h3>'+esc(v.title).replace(/\n/g,'<br>')+'</h3><p class="lead">'+esc(v.lead)+'</p><div class="rule"></div><h4>'+(d.id==='A'?'필요한 맥락을 이어갑니다':'오늘의 조언을 내일의 실행으로')+'</h4><p class="body-copy">'+esc(v.body)+'</p><h4>'+(d.id==='A'?'결과를 보고, 다음을 결정합니다':'바로 할 것과 더 확인할 것을 나눕니다')+'</h4><p class="body-copy">'+(d.id==='A'?'결과물 곁에서 의견을 나누고, 바뀐 내용을 확인한 뒤 다음 버전을 선택합니다. 중요한 결정과 그 이유는 원래 자료에 연결해 남깁니다.':'확정한 결정은 이유와 함께 남깁니다. 아직 선택하지 않은 제안은 미결로 두고, 필요한 근거를 찾은 다음 다시 판단합니다.')+'</p><p class="inline-notes">'+esc(v.note)+'</p></div><div class="doc-footer"><span>목업 · 시연용 원문</span><span>•</span><span>v'+d.view+'의 내용과 댓글이 함께 보존됩니다</span></div></div><aside class="review-panel" aria-label="자료 검토"><div class="review-head"><h3>검토 <span class="tag">'+list.length+'</span></h3><span style="font-size:10px;color:var(--muted)">자료 '+d.id+' · v'+d.view+'</span></div><p class="review-intro">이 버전에 대한 의견을 나눕니다.<br>문서 담당은 자료 A와 B를 함께 맡고 있어요.</p>'+(other.length?'<div class="version-note">다른 버전의 댓글 '+other.length+'개도 남아 있어요. <button data-action="other-version" style="color:var(--violet);text-decoration:underline">원문과 보기 ↗</button></div>':'')+(list.length?list.map(threadHTML).join(''):'<p class="empty">아직 이 버전의 댓글이 없습니다.<br>이전 요청은 해당 버전에서 볼 수 있어요.</p>')+'<div id="request-form" class="composer"><label for="request">v'+d.view+' 수정 요청</label><textarea id="request" data-draft-key="'+key()+'" placeholder="예: 자동으로 완성한다는 표현을 실제 제공 범위에 맞춰 줄여 주세요." maxlength="700">'+esc(drafts[key()]||'')+'</textarea><div class="composer-bottom"><small>자료 '+d.id+' · v'+d.view+'에 연결</small><button id="submit-request" class="button primary small" type="button" data-action="send-request" '+(!(drafts[key()]||'').trim()?'disabled':'')+'>수정 요청 보내기</button></div></div><p style="font-size:10px;color:#9c8daa;margin:10px 2px 0">전체 버전 댓글만 체험할 수 있습니다.</p></aside></div></article>';}
function chatHTML(){return '<section class="glass chat-page"><div class="chat-intro"><span class="eyebrow">업무 대화 · 요약</span><h2>결정과 결과만, 간결하게</h2><p>자세한 댓글은 자료에 남고, 이곳에서는 연결된 결과를 확인합니다.</p></div><article class="summary-card"><div class="summary-top"><span>문서 담당 · 시연</span><span class="tag">안내</span></div><h3>소개서와 멘토링 기록을 검토 중입니다.</h3><p>각 자료에서 수정 요청을 보내고 변경안을 반영해 보세요. 반영한 내용만 이 대화 요약에 추가됩니다.</p><button class="button small" data-action="back-files">자료로 돌아가기 ↗</button></article>'+summaries.slice().reverse().map(s=>'<article class="summary-card"><div class="summary-top"><span>문서 담당 · 시연</span><span class="tag green">반영 완료</span></div><h3>자료 '+s.doc+' · '+esc(docs[s.doc].title)+' v'+s.version+'</h3><p>'+esc(s.summary)+'</p><p style="margin-top:8px;font-size:11px">이유: 요청한 표현을 검토한 예시대로 반영했습니다.<br>미결: 없음 · 시연 화면 안에서만 반영됨</p><button class="button small" data-action="summary-open" data-thread="'+s.thread+'">원래 자료·댓글 보기 ↗</button></article>').join('')+'</section>';}
function render(){const active=document.activeElement,draftFocus=active?.id==='request',pos=draftFocus?active.selectionStart:null;el('app').innerHTML='<div class="shell"><aside class="side glass"><div class="brand"><i></i>IAMCEO</div><div class="side-note"><b style="color:var(--ink)">본사</b><br>시연 공간</div><div><small>프로젝트</small><div class="project">네이티브 · Codex 체험<span>자료 검토 · 목업</span></div></div><p class="side-note">기존 프로젝트 안에서<br>결과물의 검토를 이어갑니다.</p><div class="sidefoot"><i></i>목업 · 시연 데이터</div></aside><main class="main"><header class="top"><div><div class="project-title">네이티브 · Codex 체험</div><p class="top-caption">결과물 곁에서 검토하고, 다음 버전으로</p></div><nav class="nav" aria-label="IAMCEO 화면"><button disabled>홈</button><button disabled>결재함</button><button disabled>팀</button><button data-action="chat" class="'+(page==='chat'?'active':'')+'">대화</button><button data-action="files" class="'+(page==='files'?'active':'')+'">자료</button></nav></header><div class="toolbar"><div><p class="eyebrow">'+(page==='files'?'FILES & REVIEW':'WORK CONVERSATION')+'</p><h1>'+(page==='files'?'자료':'대화 요약')+'</h1><p>'+(page==='files'?'자료를 보며 의견을 나누고, 변경안을 확인하세요.':'댓글 전문 대신 결정·결과 링크를 모았습니다.')+'</p></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="button" data-action="'+(page==='files'?'chat':'files')+'">'+(page==='files'?chatIcon+' 대화 요약 보기':icon+' 자료 보기')+'</button><button class="button plain" data-action="reset" title="시연을 처음부터 다시 시작">초기화</button></div></div>'+(page==='files'&&hint?'<div class="intro-hint"><div><strong>먼저 A에서 수정 요청을 보내 보세요.</strong><span>답변을 기다리며 B로 이동해도, 결과는 A에 도착합니다.</span></div><button data-action="hint-close" aria-label="체험 안내 닫기">×</button></div>':'')+(page==='files'?'<div class="pill-switch" aria-label="자료 선택">'+Object.values(docs).map(d=>'<button data-action="select" data-doc="'+d.id+'" class="'+(selected===d.id?'selected':'')+'">'+(d.unread?'<i class="dot"></i>':'')+'자료 '+d.id+' · '+esc(d.title)+'</button>').join('')+'</div><div class="workspace"><aside class="library glass"><div class="library-head"><span>전체 자료</span><b>2</b></div>'+Object.values(docs).map(row).join('')+'<p class="library-tip">담당은 한 명,<br>검토 기록은 자료별로.<br><br>새 버전이 생겨도 이전 원문과 댓글은 남습니다.</p></aside>'+readerHTML()+'</div>':chatHTML())+'<p class="footnote">Agent-A형 자료 검토 흐름의 목업입니다. 입력과 변경은 이 화면을 닫거나 초기화하면 사라집니다.</p></main></div>';if(draftFocus&&page==='files'){const a=el('request');a?.focus();if(a&&pos!==null)a.setSelectionRange(pos,pos);}renderToast();renderModal();}
function openDoc(id,thread=null,latest=false){selected=id;page='files';docs[id].unread=false;focusThread=thread;if(thread){const t=threads.find(t=>t.id===thread);docs[id].view=t.version;panel='review';}else if(latest)docs[id].view=docs[id].latest;render();if(thread)setTimeout(()=>el('thread-'+thread)?.scrollIntoView({block:'nearest',behavior:'smooth'}),30);}
function sendRequest(){const d=current(),text=(drafts[key()]||'').trim();if(!text)return;const t={id:'request-'+seq++,doc:d.id,version:d.view,text,status:'queued',answer:'',replies:[],base:d.view};threads.push(t);drafts[key()]='';panel='review';focusThread=t.id;const e=epoch;render();const timer=setTimeout(()=>{timers.delete(timer);if(e!==epoch)return;t.status='ready';t.answer='「'+text+'」를 반영한 변경 예시를 준비했어요. 실제 제공 범위를 넘는 표현을 줄이고, 다음 행동이 보이도록 문장을 다듬었습니다.';docs[t.doc].unread=selected!==t.doc||page!=='files';toastShow('자료 '+t.doc+' · v'+t.version+' 요청의 변경안이 도착했어요.',t.doc,t.id);render();},2400);timers.add(timer);}
function proposal(t){const d=docs[t.doc],v=version(d,t.base);return {before:v.lead,after:t.doc==='A'?'목표를 정리하고 필요한 일을 이어가는 작업 공간입니다. 자료 검토와 다음 행동을 도와주며, 중요한 선택과 최종 확인은 사용자가 직접 할 수 있습니다.':'이번 주 목표에 맞는 행동을 세 가지 이내로 골라봅니다. 조언과 확정된 결정을 구분하고, 아직 확인이 필요한 가정은 다음 질문으로 남깁니다.'};}
function renderModal(){if(!modal){el('overlay').innerHTML='';return;}const t=threads.find(x=>x.id===modal),d=docs[t.doc],p=proposal(t),stale=t.base!==d.latest;el('overlay').innerHTML='<div class="dialog-shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title"><header class="dialog-header"><div><span class="eyebrow">CHANGE PREVIEW · 목업</span><h2 id="preview-title">자료 '+t.doc+' · 변경 예시 확인</h2><p>'+esc(d.title)+' · v'+t.base+' 기준 → 새 버전 후보<br>담당: 문서 담당 · 시연</p></div><button class="close" data-action="close-modal" aria-label="변경안 닫기">×</button></header><div class="diff"><div><small>현재 원문 · v'+t.base+'</small><p>'+esc(p.before)+'</p></div><div class="after"><small>변경 예시</small><p>'+esc(p.after)+'</p></div></div><div class="checks"><span>✓ 원래 요청: '+esc(t.text)+'</span><span>✓ 대상 자료와 버전을 고정한 시연 · 이전 댓글 보존</span><span>✓ 실제 내용 판단이나 직원 실행은 일어나지 않음</span></div>'+(stale?'<div class="error-note">현재 최신본은 v'+d.latest+'입니다. 이전 버전을 기준으로 한 변경안은 바로 반영할 수 없어요.</div>':'')+'<footer class="dialog-footer"><small>이 예시를 반영하면 '+(stale?'최신본 기준으로 다시 확인합니다.':'v'+(d.latest+1)+'이 생성됩니다.')+'<br>실제 자료에는 영향을 주지 않습니다.</small><button class="button primary" data-action="'+(stale?'rebase':'apply')+'" data-thread="'+t.id+'">'+(stale?'최신 버전 기준으로 예시 다시 만들기':'이 예시대로 반영')+'</button></footer></section></div>';el('overlay').firstElementChild.style.top=modalAt+'px';setTimeout(()=>{el('overlay').querySelector('.dialog')?.scrollIntoView({block:'center'});el('overlay').querySelector('.close')?.focus({preventScroll:true});},20);}
function apply(t){const d=docs[t.doc];if(d.latest!==t.base){t.status='conflict';renderModal();return;}const v=version(d,d.latest),n=d.latest+1,p=proposal(t);d.versions.push({...v,n,file:'시연 '+d.id+'-v'+n,lead:p.after,note:'v'+t.version+'의 수정 요청을 반영한 시연입니다. 이전 원문과 댓글은 버전 선택에서 확인할 수 있습니다.'});d.latest=n;d.view=n;t.status='applied';t.appliedVersion=n;summaries.push({doc:d.id,version:n,thread:t.id,summary:'요청한 표현을 확인하고 변경 예시를 새 버전으로 반영했습니다. 이전 버전의 원문과 검토 대화는 보존했습니다.'});threads.filter(x=>x.doc===d.id&&x.id!==t.id&&x.status==='ready'&&x.base!==n).forEach(x=>x.status='conflict');modal=null;selected=d.id;page='files';panel='document';focusThread=null;render();toastShow('자료 '+d.id+'에 새 버전 v'+n+'이 생겼어요. 이전 댓글도 남아 있어요.',d.id,t.id);}
function sendReply(t){const input=document.querySelector('[data-reply="'+t.id+'"] input'),text=input.value.trim();if(!text)return;t.replies.push({author:'대표',text},{author:'문서 담당 · 시연',text:'답글을 확인했어요. 이 대화는 자료 '+t.doc+'의 v'+t.version+'에 그대로 남습니다.'});focusThread=t.id;render();}
document.addEventListener('input',e=>{if(e.target.id==='request'){drafts[key()]=e.target.value;el('submit-request').disabled=!e.target.value.trim();}});
document.addEventListener('change',e=>{if(e.target.id==='version'){current().view=Number(e.target.value);focusThread=null;render();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,t=threads.find(t=>t.id===b.dataset.thread);if(a==='send-request')sendRequest();else if(a==='reply-send')sendReply(t);else if(a==='select')openDoc(b.dataset.doc);else if(a==='chat'){page='chat';render();}else if(a==='files'||a==='back-files'){page='files';render();}else if(a==='panel-doc'){panel='document';render();}else if(a==='panel-review'){panel='review';render();}else if(a==='latest'){current().view=current().latest;render();}else if(a==='other-version'){const o=threads.find(t=>t.doc===selected&&t.version!==current().view);if(o)openDoc(selected,o.id);}else if(a==='preview'){modalAt=Math.max(40,b.getBoundingClientRect().top+scrollY-140);modal=t.id;renderModal();}else if(a==='close-modal'){modal=null;renderModal();}else if(a==='apply')apply(t);else if(a==='rebase'){t.base=docs[t.doc].latest;t.status='ready';renderModal();}else if(a==='view-applied'){current().view=t.appliedVersion;panel='document';render();}else if(a==='reply-toggle'){const f=document.querySelector('[data-reply="'+t.id+'"]');f.hidden=!f.hidden;if(!f.hidden)f.querySelector('input').focus();}else if(a==='summary-open')openDoc(t.doc,t.id);else if(a==='toast-open'){const x=toast;toast=null;openDoc(x.doc,x.thread);}else if(a==='toast-close'){toast=null;renderToast();}else if(a==='hint-close'){hint=false;render();}else if(a==='reset'){epoch++;timers.forEach(clearTimeout);timers.clear();docs=makeDocs();summaries=[];seq=1;selected='A';page='files';panel='document';hint=true;focusThread=null;modal=null;drafts={};toast=null;seed();render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal();}});
render();
})();
</script></body></html>
