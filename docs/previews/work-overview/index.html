 {id:'u1',member:null,state:'ready',title:'업무 연결 집중 보기',note:'선택한 일의 관련 업무만 표시',time:'계약 r3',status:'배정 가능',goal:'노드를 우클릭하면 연결된 업무만 남기고, 전체 보기로 원래 화면을 복원합니다.',source:'업무 노드를 오른쪽 클릭하면 해당 노드와 연결된 것들만 볼 수 있게 해 주세요.',acceptance:['직접 연결된 업무와 관계 종류를 확인할 수 있습니다.','전체 보기에서 원래 배치와 선택을 복원합니다.','터치 메뉴와 키보드에서도 같은 기능을 사용할 수 있습니다.'],constraints:['다른 프로젝트의 업무와 자료를 가져오지 않습니다.','기존 승인·중단 보호·순서 조건을 유지합니다.','실행 중인 업무를 중단하거나 담당을 바꾸지 않습니다.']},
 {id:'u2',member:null,state:'ready',title:'미배정 목록 정리',note:'실행 가능 여부와 대기 사유 분리',time:'계약 r1',status:'배정 가능',goal:'미배정 목록에서 바로 배정할 수 있는 일과 요구사항 확인이 필요한 일을 구분합니다.',source:'미배정이 많은데 왜 모두 대기하는지 확인할 수 있게 해 주세요.',acceptance:['미배정 원인과 다음 확인 담당자를 표시합니다.','같은 업무가 집계에 중복되지 않습니다.'],constraints:['미승인 후보를 실행하지 않습니다.','입력 수신 여부를 모르면 자동으로 다시 보내지 않습니다.']},
 {id:'u3',member:null,state:'locked',title:'자동 반복 실행 정책',note:'재시도 범위·실행 승인 미정',time:'요구사항 확인',status:'확인 필요',goal:'후속 실행 정책을 검토할 후보입니다.',source:'완료 조건을 채울 때까지 업무를 이어갈 방법을 정리합니다.',acceptance:['재시도 범위와 중단 조건의 확정이 필요합니다.'],constraints:['후보 등록은 구현 실행 승인이 아닙니다.','기존 재시도 횟수와 예산을 늘리지 않습니다.']}
];
const links=[['d1','c1','sequence'],['c1','n1','sequence'],['d2','c2','sequence'],['c2','n2','sequence'],['c3','n3','sequence'],['d3','c4','sequence'],['c1','c2','derived'],['c2','c3','derived'],['n1','n3','derived']];
let filter='all',view='board',focus=null,focusDepth='direct',savedFilter='all',savedScroll=0,dragged=null,pending=null,opener=null,toastTimer;
const $=s=>document.querySelector(s),task=id=>tasks.find(t=>t.id===id),member=id=>members.find(m=>m.id===id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function focusIds(){
 if(!focus)return null;
 const ids=new Set([focus]);
 if(focusDepth==='family'){
  const todo=[focus];while(todo.length){const current=todo.shift();for(const[a,b,k]of links){if(k!=='derived')continue;const next=a===current?b:b===current?a:null;if(next&&!ids.has(next)){ids.add(next);todo.push(next)}}}
 }
 const roots=new Set(ids);for(const[a,b]of links){if(roots.has(a))ids.add(b);if(roots.has(b))ids.add(a)}return ids;
}
function visible(t){const ids=focusIds();return (!ids||ids.has(t.id))&&(filter==='all'||t.state===filter)}
function card(t){
 const icon=t.state==='done'?'✓':t.state==='blocked'?'!':t.state==='running'?'●':t.state==='queued'?'→':t.state==='locked'?'○':'⋮⋮';
 return `<article class="task-card ${t.state==='locked'?'locked':''} ${focus===t.id?'focused':''}" data-id="${t.id}" data-state="${t.state}" ${!t.member?'draggable="true"':''}><button type="button" class="card-open" data-open="${t.id}" aria-label="${esc(t.title)} · ${esc(t.status)}"><span class="card-status"><span aria-hidden="true">${icon}</span>${esc(t.status)}</span><strong class="card-title">${esc(t.title)}</strong><span class="card-note">${esc(t.note)}</span><span class="card-meta"><span>${esc(t.next||'')}</span><span>${esc(t.time)}</span></span></button><button type="button" class="more" aria-label="${esc(t.title)} 메뉴" aria-haspopup="menu" data-more="${t.id}">···</button></article>`;
}
function render(){
 const count=s=>tasks.filter(t=>s==='all'||t.state===s).length;
 $('#filters').innerHTML=[['all','전체'],['blocked','조치 필요'],['running','실행 중'],['queued','다음'],['done','완료']].map(([s,l])=>`<button type="button" class="filter" data-filter="${s}" aria-pressed="${s===filter}">${s==='blocked'?'<span class="dot amber" aria-hidden="true"></span>':s==='running'?'<span class="dot blue" aria-hidden="true"></span>':''}${l}<b>${count(s)}</b></button>`).join('');
 $('#lanes').innerHTML=members.map(m=>{
  const own=tasks.filter(t=>t.member===m.id&&visible(t));if(!own.length&&(focus||filter!=='all'))return '';
  const cell=(kind,items,empty)=>`<div class="lane-cell ${kind} ${kind==='next'?'dropcell':''}" ${kind==='next'?`data-drop="${m.id}" aria-label="${m.name}의 다음 업무 배정 위치"`:''}><span class="cell-caption">${kind==='past'?'최근 완료':kind==='now'?'지금':'다음'}</span>${items.map(card).join('')||`<div class="empty">${focus||filter!=='all'?'—':empty}</div>`}${kind==='next'?'<div class="drop-hint">다음 업무로 배정</div>':''}</div>`;
  return `<div class="lane" data-member="${m.id}"><div class="person"><span class="avatar ${m.class}" aria-hidden="true">${m.initial}</span><div><h3>${m.name}</h3><p>${m.role}</p></div></div>${cell('past',own.filter(t=>t.state==='done'),'—')}${cell('now',own.filter(t=>['blocked','running'].includes(t.state)),'현재 업무 없음')}${cell('next',own.filter(t=>t.state==='queued'),'배정된 다음 업무 없음')}</div>`;
 }).join('')||'<p class="focus-empty">이 조건에 해당하는 업무가 없습니다.</p>';
 const queue=tasks.filter(t=>!t.member&&visible(t));$('#queue-count').textContent=tasks.filter(t=>!t.member).length+'건';
 $('#queue').innerHTML=[['ready','배정 가능'],['locked','요구사항 확인']].map(([s,l])=>{const items=queue.filter(t=>t.state===s);return items.length?`<p class="queue-label">${l} ${items.length}</p><div class="queue-list">${items.map(card).join('')}</div>`:''}).join('')||'<p class="note">현재 보기의 미배정 업무가 없습니다.</p>';
 $('#shown').textContent=`${members.filter(m=>tasks.some(t=>t.member===m.id&&visible(t))).length}명 · 표시 ${tasks.filter(visible).length} / 전체 ${tasks.length}개 업무`;
 $('#focusbar').hidden=!focus;
 if(focus)$('#focusbar').innerHTML=`<span class="focusname">${esc(task(focus).title)} <span style="font-weight:400;color:var(--muted)">· 연결 ${focusIds().size-1}</span></span><button type="button" data-depth="direct" aria-pressed="${focusDepth==='direct'}">직접 연결</button><button type="button" data-depth="family" aria-pressed="${focusDepth==='family'}">업무 묶음</button><button type="button" class="restore" id="restore">전체 보기 ↗</button>`;
 $('#legend').hidden=view!=='map'&&!focus;$('#maphint').hidden=view!=='map'&&!focus;
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));
 requestAnimationFrame(drawEdges);
}
function drawEdges(){
 const svg=$('#edges');svg.innerHTML='';if(view!=='map'&&!focus)return;
 const box=$('#board').getBoundingClientRect();let paths='';
 for(const[a,b,kind]of links){const from=$(`[data-id="${a}"]`),to=$(`[data-id="${b}"]`);if(!from||!to)continue;const f=from.getBoundingClientRect(),t=to.getBoundingClientRect();let d;
  if(Math.abs(f.top-t.top)<10){const x1=f.right-box.left,x2=t.left-box.left,y1=f.top+f.height/2-box.top,y2=t.top+t.height/2-box.top;d=`M${x1} ${y1} C${x1+10} ${y1},${x2-10} ${y2},${x2} ${y2}`}
  else{const x1=f.left+f.width*.65-box.left,x2=t.left+t.width*.35-box.left,down=t.top>f.top,y1=(down?f.bottom:f.top)-box.top,y2=(down?t.top:t.bottom)-box.top,mid=(y1+y2)/2;d=`M${x1} ${y1} C${x1} ${mid},${x2} ${mid},${x2} ${y2}`}
  paths+=`<path class="edge ${kind}" d="${d}" marker-end="url(#arrow-${kind})"/>`;
 }
 svg.innerHTML=`<defs><marker id="arrow-sequence" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#b9bfd0"/></marker><marker id="arrow-derived" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#ae9bd2"/></marker></defs>${paths}`;
}
function concentrate(id){if(!focus){savedFilter=filter;savedScroll=window.scrollY}focus=id;focusDepth='direct';filter='all';closeMenu();render();$(`[data-open="${id}"]`)?.focus({preventScroll:true});$('#live').textContent=`${task(id).title}와 연결된 업무 ${focusIds().size-1}개를 표시합니다.`}
function restore(){focus=null;filter=savedFilter;render();window.scrollTo(0,savedScroll);$('#live').textContent='전체 보기로 돌아왔습니다.'}
function closeMenu(){const menu=$('#menu');menu.hidden=true;menu.innerHTML=''}
function openMenu(id,trigger){const menu=$('#menu'),r=trigger.getBoundingClientRect();opener=trigger;menu.innerHTML=`<button type="button" role="menuitem" data-focus="${id}">연결된 업무만 보기</button>${!task(id).member?`<button type="button" role="menuitem" data-assign="${id}">배정…</button>`:''}<button type="button" role="menuitem" data-open="${id}">상세 보기</button>`;menu.hidden=false;menu.style.left=Math.max(8,Math.min(r.left,innerWidth-203))+'px';menu.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-menu.offsetHeight-8))+'px';menu.querySelector('button').focus()}
function showDialog(el,html){closeMenu();el.innerHTML=html;el.showModal()}
function openDetail(id){const t=task(id);opener=$(`[data-open="${id}"]`);showDialog($('#detail'),`<header class="dialog-head"><div><h2 id="detail-title">${esc(t.title)}</h2><p>${esc(t.member?member(t.member).name:'미배정')} · ${esc(t.status)}</p></div><button type="button" class="close" data-close="detail" aria-label="상세 닫기">×</button></header><div class="dialog-body">${t.state==='blocked'?`<div class="issue">${esc(t.note)}<br>${esc(t.next)}${t.historical?'<br>옛 기록이지만 완료가 확인되지 않아 현재 업무에 남아 있습니다.':''}</div>`:''}<section><h3>${t.state==='done'?'완료 결과':'현재 확인한 내용'}</h3><p>${esc(t.goal||t.note)}</p></section><dl class="detail-facts"><dt>마지막 기록</dt><dd>${esc(t.time)}</dd><dt>완료 판정</dt><dd>${t.state==='done'?'이 업무의 합의된 완료 조건 확인':'완료 조건 확인 전'}</dd></dl>${t.acceptance?`<section><h3>완료 조건</h3><ul>${t.acceptance.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></section>`:''}<section><h3>연결된 업무</h3><ul>${links.filter(e=>e[0]===id||e[1]===id).map(e=>`<li>${esc(task(e[0]===id?e[1]:e[0]).title)} <span class="note">· ${e[2]==='derived'?'파생':'순서'}</span></li>`).join('')||'<li>연결된 업무가 없습니다.</li>'}</ul></section></div><footer class="dialog-footer"><button type="button" class="btn" data-focus-dialog="${id}">연결된 업무만 보기</button>${!t.member?`<button type="button" class="btn primary" data-assign-dialog="${id}">배정</button>`:''}</footer>`)}
function pickMember(id){opener=$(`[data-open="${id}"]`);showDialog($('#assignment'),`<header class="dialog-head"><div><h2 id="assignment-title">업무 배정</h2><p>${esc(task(id).title)}</p></div><button type="button" class="close" data-close="assignment" aria-label="배정 닫기">×</button></header><div class="dialog-body"><label class="pick-label">담당 직원<select id="member-pick">${members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></label></div><footer class="dialog-footer"><button type="button" class="btn" data-close="assignment">취소</button><button type="button" class="btn primary" data-preview="${id}">인계 확인</button></footer>`)}
function previewAssignment(id,memberId){const t=task(id),m=member(memberId);if(!t||t.member||!m)return;pending={id,memberId};opener=$(`[data-open="${id}"]`);const n=tasks.filter(x=>x.member===memberId&&x.state==='queued').length+1;const locked=t.state==='locked';const html=`<header class="dialog-head"><div><h2 id="assignment-title">${esc(m.name)}에게 배정</h2><p>${esc(t.title)}</p></div><button type="button" class="close" data-close="assignment" aria-label="배정 닫기">×</button></header><div class="dialog-body"><div class="handoff-top"><div><strong>다음 ${n}번째 업무</strong><p>앞선 업무를 완료한 뒤 시작</p></div><span>${esc(t.time)}</span></div>${locked?'<div class="issue" role="alert">이 업무는 실행 범위와 승인이 아직 확정되지 않았습니다. 요구사항을 확인한 뒤 배정할 수 있습니다.</div>':''}<section><h3>원래 지시</h3><div class="source"><p>${esc(t.source)}</p><cite>대표 · 19:48 · 원문 연결 유지</cite></div></section><section><h3>완료 조건</h3><ul>${t.acceptance.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section><section><h3>함께 넘길 맥락</h3><p>업무 정의 · 부모 업무 · 최근 보고 · 관련 자료</p><p class="note">같은 업무 ID와 확정 계약을 이어받습니다.</p></section><section><h3>지켜야 할 조건</h3><ul>${t.constraints.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section></div><footer class="dialog-footer"><button type="button" class="btn" data-close="assignment">취소</button><button type="button" class="btn primary" id="confirm-assignment" ${locked?'disabled':''}>배정</button></footer>`;if($('#assignment').open)$('#assignment').innerHTML=html;else showDialog($('#assignment'),html)}
function confirmAssignment(){if(!pending)return;const t=task(pending.id),m=member(pending.memberId);if(!t||t.member||t.state!=='ready')return;const n=tasks.filter(x=>x.member===m.id&&x.state==='queued').length+1;const prior=tasks.filter(x=>x.member===m.id&&x.state!=='done').at(-1);t.member=m.id;t.state='queued';t.status='배정됨 · 시작 대기';t.note='앞선 업무 완료 후 시작';t.time=`다음 ${n}`;if(prior)links.push([prior.id,t.id,'sequence']);$('#assignment').close();pending=null;render();const text=`${m.name}의 다음 업무로 배정했습니다.`;$('#receipt').textContent=text;$('#receipt').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#receipt').hidden=true,4200);$(`[data-open="${t.id}"]`)?.focus({preventScroll:true})}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b){if(!e.target.closest('#menu'))closeMenu();return}
 if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.view){view=b.dataset.view;render();return}
 if(b.dataset.depth){focusDepth=b.dataset.depth;render();return}if(b.id==='restore'){restore();return}
 if(b.dataset.more){openMenu(b.dataset.more,b);return}if(b.dataset.focus){concentrate(b.dataset.focus);return}
 if(b.dataset.open){openDetail(b.dataset.open);return}if(b.dataset.close){$('#'+b.dataset.close).close();return}
 if(b.dataset.assign){pickMember(b.dataset.assign);return}
 if(b.dataset.assignDialog){$('#detail').close();pickMember(b.dataset.assignDialog);return}
 if(b.dataset.focusDialog){$('#detail').close();concentrate(b.dataset.focusDialog);return}
 if(b.dataset.preview){previewAssignment(b.dataset.preview,$('#member-pick').value);return}
 if(b.id==='confirm-assignment'){confirmAssignment();return}if(!b.closest('#menu'))closeMenu();
});
document.addEventListener('contextmenu',e=>{const c=e.target.closest('.task-card');if(c){e.preventDefault();concentrate(c.dataset.id)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#menu').hidden){e.preventDefault();closeMenu();opener?.focus()}if((e.key==='F10'&&e.shiftKey)||e.key==='ContextMenu'){const c=e.target.closest('.task-card');if(c){e.preventDefault();concentrate(c.dataset.id)}}if(!$('#menu').hidden&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const buttons=[...$('#menu').querySelectorAll('button')];const i=buttons.indexOf(document.activeElement);buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length].focus()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest('.task-card[draggable=true]');if(!c)return;dragged=c.dataset.id;e.dataTransfer.setData('text/plain',dragged);e.dataTransfer.effectAllowed='move';document.querySelectorAll('.dropcell').forEach(el=>el.classList.add('drag-target'))});
document.addEventListener('dragover',e=>{const d=e.target.closest('[data-drop]');if(d&&dragged){e.preventDefault();e.dataTransfer.dropEffect='move';d.classList.add('drag-over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('[data-drop]');if(d&&!d.contains(e.relatedTarget))d.classList.remove('drag-over')});
function clearDrag(){dragged=null;document.querySelectorAll('.dropcell').forEach(d=>d.classList.remove('drag-target','drag-over'))}
document.addEventListener('drop',e=>{const d=e.target.closest('[data-drop]');if(d&&dragged){e.preventDefault();const id=dragged;clearDrag();previewAssignment(id,d.dataset.drop)}});
document.addEventListener('dragend',clearDrag);
for(const el of document.querySelectorAll('dialog'))el.addEventListener('close',()=>{pending=null;if(opener?.isConnected)opener.focus({preventScroll:true})});
window.addEventListener('resize',drawEdges);new ResizeObserver(drawEdges).observe($('#board'));render();
</script>
</body>
